<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>MakwinIT — Silver Parallax Pass</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050d19;
  --card:#0b1b30;
  --text:#f7f9ff;
  --muted:rgba(226,235,255,.58);
  --blue:#2f6bff;
  --blue-light:#8eafff;
  --ticket-tilt:14;
  --ticket-depth:12;
  --ticket-flip:170 15;
  --radius:28px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{min-width:260px;min-height:100%;margin:0}
body{
  min-height:100svh;
  overflow:hidden;
  display:grid;
  place-items:center;
  padding:24px 18px;
  color:var(--text);
  font-family:var(--font);
  background:
    radial-gradient(ellipse at 50% 42%,rgba(47,107,255,.18),transparent 34%),
    radial-gradient(ellipse at 15% 90%,rgba(18,88,170,.15),transparent 35%),
    radial-gradient(ellipse at 90% 8%,rgba(72,111,255,.10),transparent 28%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
.scene{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:25px;
  perspective:1100px;
}
.eyebrow{
  display:flex;align-items:center;gap:9px;
  color:rgba(225,235,255,.52);
  font-size:10px;font-weight:650;letter-spacing:.23em;text-transform:uppercase;
}
.eyebrow::before,.eyebrow::after{content:"";width:24px;height:1px;background:rgba(180,203,255,.24)}
.stage{
  position:relative;
  width:min(264px,calc(100vw - 54px));
  aspect-ratio:264/356;
  perspective:1000px;
  touch-action:pan-y;
}
.ticket{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent;
  will-change:transform;
}
.ticket:focus-visible{outline:2px solid var(--blue-light);outline-offset:9px;border-radius:var(--radius)}
.side{
  position:absolute;inset:0;overflow:hidden;
  border-radius:var(--radius);
  background:var(--card);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 34px 90px rgba(0,0,0,.45),0 0 55px rgba(47,107,255,.11);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.front{isolation:isolate;background:#0b1b30}

.art::before{
  content:none;
}
.art::after{
  content:none;
}
.front-content{position:absolute;inset:0;padding:24px;z-index:2;pointer-events:none;will-change:transform}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-mark{
  display:grid;place-items:center;width:35px;height:35px;border-radius:12px;
  color:#fff;font-size:17px;font-weight:850;letter-spacing:-.08em;
  background:linear-gradient(145deg,#4b83ff,#1745c5);
  box-shadow:0 7px 22px rgba(47,107,255,.35);
}
.brand-name{margin-left:9px;font-size:12px;font-weight:750;letter-spacing:.16em}
.brand-lockup{display:flex;align-items:center}
.pass-tag{
  padding:7px 9px;border:1px solid rgba(255,255,255,.24);border-radius:999px;
  color:rgba(255,255,255,.82);font-size:8px;font-weight:700;letter-spacing:.15em;
  background:rgba(255,255,255,.07);backdrop-filter:blur(12px);
}
.front-title{
  position:absolute;left:24px;right:15px;top:91px;
  font-size:clamp(34px,12.5vw,41px);font-weight:900;line-height:.9;
  letter-spacing:-.075em;color:#fff;text-shadow:0 5px 28px rgba(0,0,0,.75);
}
.front-title span{display:block;color:#a9c3ff}
.front-meta{
  position:absolute;left:24px;right:24px;bottom:25px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  color:rgba(255,255,255,.88);font-size:8px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  text-shadow:0 2px 12px rgba(0,0,0,.9);
}
.front-meta b{color:#fff;font-size:10px;letter-spacing:.08em}
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(2,9,20,.08),transparent 38%,rgba(2,8,18,.7))}
.glare{
  position:absolute;inset:0;z-index:4;pointer-events:none;opacity:var(--g,0);
  background:radial-gradient(230px circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.26),transparent 62%);
  mix-blend-mode:screen;
}
.back{
  transform:rotateY(180deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:17px;padding:24px;text-align:center;
  background:
    radial-gradient(circle at 50% 0%,rgba(47,107,255,.22),transparent 46%),
    linear-gradient(155deg,#102748,#071426 70%);
}
.back::before{
  content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.09);
  border-radius:20px;pointer-events:none;
}
.back-kicker{color:#9db8f4;font-size:9px;font-weight:750;letter-spacing:.22em;text-transform:uppercase}
.qr-wrap{
  position:relative;width:176px;height:176px;max-width:100%;
  padding:10px;border-radius:19px;background:#fff;
  box-shadow:0 10px 36px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.55);
}
.qr-wrap img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.back-handle{font-size:16px;font-weight:800;letter-spacing:.02em;color:#fff}
.back-caption{color:rgba(224,234,255,.58);font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.flip-hint{
  color:rgba(222,233,255,.44);font-size:10px;letter-spacing:.08em;
  text-align:center;
}
.flip-hint span{color:rgba(222,233,255,.78)}
@media(max-height:560px){
  body{overflow:auto;min-height:100svh}
  .scene{gap:14px}
  .stage{width:min(220px,calc((100svh - 90px)*.742));}
  .flip-hint{font-size:9px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}


/* Silver edition */
:root{
  color-scheme:dark;
  --card:#dfe2e5;
  --text:#20252b;
  --muted:#626b74;
}
body{
  background:
    radial-gradient(ellipse at 50% 43%,rgba(220,226,233,.16),transparent 37%),
    radial-gradient(ellipse at 12% 92%,rgba(120,132,146,.13),transparent 34%),
    linear-gradient(145deg,#101318,#20252c 58%,#0b0e12);
}
.eyebrow{color:rgba(238,242,246,.64)}
.eyebrow::before,.eyebrow::after{background:rgba(221,228,236,.32)}
.side{

<script>
(() => {
  const stage = document.getElementById('stage');
  const ticket = document.getElementById('ticket');
  const glare = document.getElementById('glare');
  const layers = [...ticket.querySelectorAll('.depth')].map(el => ({el, depth:Number(el.dataset.depth)}));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const read = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  const number = (name, fallback) => parseFloat(read(name, String(fallback)));
  const pair = (name, fallback) => read(name, fallback).split(/\s+/).map(Number);
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const spring = (x, k, c) => ({x, v:0, t:x, k, c:reduce ? 2*Math.sqrt(k) : c});
  const tilt = number('--ticket-tilt', 14);
  const depth = number('--ticket-depth', 12);
  const flipSpring = pair('--ticket-flip', '170 15');
  const rx = spring(0,220,18);
  const ry = spring(0,220,18);
  const flip = spring(0,flipSpring[0],flipSpring[1]);
  const glareSpring = spring(0,300,26);
  const lift = spring(1,300,18);
  let hovered=false, flipped=false, clock=0, gx=50, gy=30, last=performance.now();

  function step(s, dt){
    const a=-s.k*(s.x-s.t)-s.c*s.v;
    s.v+=a*dt;
    s.x+=s.v*dt;
  }
  stage.addEventListener('pointermove', event => {
    const rect=stage.getBoundingClientRect();
    const nx=clamp((event.clientX-rect.left)/rect.width*2-1,-1,1);
    const ny=clamp((event.clientY-rect.top)/rect.height*2-1,-1,1);
    gx=(nx+1)*50; gy=(ny+1)*50;
    hovered=true;
    rx.t=-ny*tilt;
    ry.t=nx*tilt;
    glareSpring.t=1;
  });
  stage.addEventListener('pointerleave', () => {hovered=false;glareSpring.t=.25;});
  stage.addEventListener('pointerdown', () => {lift.t=.975;});
  window.addEventListener('pointerup', () => {lift.t=1;});

  function toggle(){
    flipped=!flipped;
    flip.t=flipped?180:0;
    lift.v+=1.25;
    ticket.setAttribute('aria-pressed',String(flipped));
  }
  ticket.addEventListener('click',toggle);
  ticket.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle();}
  });

  function frame(now){
    const dt=Math.min((now-last)/1000,1/30);last=now;clock+=dt;
    if(!hovered){rx.t=reduce?0:Math.sin(clock*.9)*4;ry.t=reduce?0:Math.cos(clock*.7)*7;}
    [rx,ry,flip,glareSpring,lift].forEach(s=>step(s,dt));
    ticket.style.transform=`rotateX(${rx.x}deg) rotateY(${ry.x+flip.x}deg) scale(${lift.x})`;
    const ox=ry.x/tilt, oy=-rx.x/tilt;
    layers.forEach(layer=>{
      layer.el.style.transform=`translate(${ox*depth*layer.depth}px,${oy*depth*layer.depth}px)`;
    });
    glare.style.setProperty('--g',clamp(glareSpring.x,0,1));
    glare.style.setProperty('--gx',(hovered?gx:50+ox*30)+'%');
    glare.style.setProperty('--gy',(hovered?gy:30+oy*30)+'%');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
